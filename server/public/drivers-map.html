<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chauffeurs Disponibles - Taxi J7</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  .container { display: flex; height: 100vh; }

  #map { flex: 1; }

  .sidebar {
    width: 350px;
    background: white;
    border-left: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid #ddd;
    background: #f5f5f5;
  }

  .sidebar-header h2 {
    font-size: 18px;
    margin-bottom: 8px;
  }

  .sidebar-header p {
    color: #666;
    font-size: 13px;
  }

  .drivers-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .driver-item {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .driver-item:hover {
    background: #f9f9f9;
    border-color: #1a1a1a;
  }

  .driver-item.selected {
    background: #1a1a1a;
    color: white;
    border-color: #1a1a1a;
  }

  .driver-name { font-weight: 600; margin-bottom: 4px; }
  .driver-phone { font-size: 12px; color: #666; margin-bottom: 4px; }
  .driver-vehicle { font-size: 12px; color: #666; margin-bottom: 4px; }
  .driver-status {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    background: #e8f5e9;
    color: #1e7d34;
    font-weight: 600;
  }

  .driver-item.selected .driver-status {
    background: rgba(255,255,255,0.3);
    color: white;
  }
</style>
</head>
<body>
  <div class="container">
    <div id="map"></div>
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>👥 Chauffeurs</h2>
        <p id="count">Chargement...</p>
      </div>
      <div class="drivers-list" id="drivers-list"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const API_URL = window.location.origin;
    let map = null;
    let markers = {};

    function initMap() {
      map = L.map('map').setView([45.5017, -73.5673], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);
    }

    async function loadDrivers() {
      try {
        const res = await fetch(API_URL + '/drivers');
        if (!res.ok) throw new Error('Erreur');

        const drivers = await res.json();
        const available = drivers.filter(d => d.driverProfile?.status === 'AVAILABLE');

        document.getElementById('count').textContent = `${available.length} disponible(s)`;

        const list = document.getElementById('drivers-list');
        list.innerHTML = '';

        available.forEach(driver => {
          const profile = driver.driverProfile;
          if (!profile?.lat || !profile?.lng) return;

          // Ajouter marker sur la carte
          const icon = L.divIcon({
            html: `<div style="background: #1a1a1a; color: white; padding: 8px; border-radius: 4px; font-weight: bold;">🚕 ${driver.name}</div>`,
            iconSize: [100, 40],
          });

          const marker = L.marker([profile.lat, profile.lng], { icon }).addTo(map);
          marker.bindPopup(`<b>${driver.name}</b><br>${driver.phone}<br>${profile.vehicle || 'N/A'}`);
          markers[driver.id] = marker;

          // Ajouter à la liste
          const item = document.createElement('div');
          item.className = 'driver-item';
          item.innerHTML = `
            <div class="driver-name">${driver.name}</div>
            <div class="driver-phone">${driver.phone}</div>
            <div class="driver-vehicle">🚗 ${profile.vehicle || 'Véhicule'}</div>
            <div class="driver-status">DISPONIBLE</div>
          `;

          item.addEventListener('click', () => {
            document.querySelectorAll('.driver-item').forEach(el => el.classList.remove('selected'));
            item.classList.add('selected');
            marker.openPopup();
            map.setView([profile.lat, profile.lng], 14);
          });

          list.appendChild(item);
        });

      } catch (err) {
        document.getElementById('drivers-list').innerHTML = `<div style="padding: 16px; color: #d32f2f;">Erreur: ${err.message}</div>`;
      }
    }

    initMap();
    loadDrivers();
    setInterval(loadDrivers, 5000);
  </script>
</body>
</html>
