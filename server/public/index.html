<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Réserver un taxi</title>
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e0dc;
    --accent: #1a1a1a;
    --accent-ink: #ffffff;
    --success: #1e7d34;
    --error: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .card {
    width: 100%;
    max-width: 420px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .brand .emoji { font-size: 28px; }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 700; }
  h2 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; font-weight: 800; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin: 16px 0 6px;
  }
  input, textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .msg.success { display: block; background: #e8f5e9; color: var(--success); }
  .msg.error { display: block; background: #fdecea; color: var(--error); }
  .locate {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0;
    width: auto;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
  }
  .locate:disabled { opacity: 0.5; }
  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="emoji">🚕</span>
      <h1>Taxi J7</h1>
    </div>

    <h2>Réservez votre taxi</h2>
    <p class="subtitle">Votre demande est envoyée directement au répartiteur. Un chauffeur vous sera assigné sous peu.</p>

    <form id="booking-form">
      <label for="pickup">Adresse de prise en charge</label>
      <input id="pickup" name="pickupAddress" type="text" required autocomplete="off" placeholder="Ex: 12 rue de Paris" />
      <button type="button" class="locate" id="locate-btn">📍 Utiliser ma position</button>

      <label for="destination">Destination</label>
      <input id="destination" name="destinationAddress" type="text" required autocomplete="off" placeholder="Ex: Gare Centrale" />

      <label for="phone">Numéro de téléphone</label>
      <input id="phone" name="clientPhone" type="tel" required autocomplete="tel" placeholder="Ex: 0612345678" />

      <label for="name">Votre nom (optionnel)</label>
      <input id="name" name="clientName" type="text" autocomplete="name" />

      <label for="notes">Notes (optionnel)</label>
      <textarea id="notes" name="notes" rows="2" placeholder="Ex: bagages, code d'entrée..."></textarea>

      <button type="submit" id="submit-btn">Demander un taxi</button>
    </form>

    <div class="msg" id="msg"></div>

    <footer>Besoin d'aide ? Appelez-nous directement.</footer>
  </div>

<script>
  const form = document.getElementById("booking-form");
  const submitBtn = document.getElementById("submit-btn");
  const msg = document.getElementById("msg");
  const locateBtn = document.getElementById("locate-btn");
  const pickupInput = document.getElementById("pickup");

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = "msg " + kind;
  }

  locateBtn.addEventListener("click", () => {
    if (!navigator.geolocation) {
      showMsg("La géolocalisation n'est pas disponible sur cet appareil.", "error");
      return;
    }
    locateBtn.disabled = true;
    locateBtn.textContent = "Localisation en cours...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        pickupInput.value = latitude.toFixed(5) + ", " + longitude.toFixed(5);
        locateBtn.disabled = false;
        locateBtn.textContent = "📍 Utiliser ma position";
      },
      () => {
        showMsg("Impossible d'obtenir votre position. Entrez l'adresse manuellement.", "error");
        locateBtn.disabled = false;
        locateBtn.textContent = "📍 Utiliser ma position";
      }
    );
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Envoi en cours...";

    const data = Object.fromEntries(new FormData(form).entries());

    try {
      const res = await fetch("/public/book", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(body.error || "Une erreur est survenue");
      }
      showMsg("Demande envoyée ! Un chauffeur va vous être assigné sous peu.", "success");
      form.reset();
    } catch (err) {
      showMsg(err.message || "Impossible d'envoyer la demande. Réessayez.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Demander un taxi";
    }
  });
</script>
</body>
</html>
