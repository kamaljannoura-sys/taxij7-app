<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Réserver un taxi</title>
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e0dc;
    --accent: #1a1a1a;
    --accent-ink: #ffffff;
    --success: #1e7d34;
    --error: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .card {
    width: 100%;
    max-width: 420px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .brand .emoji { font-size: 28px; }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 700; }
  h2 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; font-weight: 800; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin: 16px 0 6px;
  }
  input, textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }
  .msg.success { display: block; background: #e8f5e9; color: var(--success); }
  .msg.error { display: block; background: #fdecea; color: var(--error); }
  .locate {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0;
    width: auto;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
  }
  .locate:disabled { opacity: 0.5; }
  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }
  .ac-wrap { position: relative; }
  .ac-list {
    position: absolute;
    left: 0; right: 0; top: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    z-index: 20;
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
  .ac-list.open { display: block; }
  .ac-item {
    padding: 12px 14px;
    font-size: 14px;
    cursor: pointer;
    border-top: 1px solid #f0f0f0;
  }
  .ac-item:hover, .ac-item.active { background: #f3f3f3; }

  .vehicles { display: flex; gap: 8px; margin-top: 6px; }
  .vehicle {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    background: var(--card);
  }
  .vehicle.selected { border-color: var(--ink); background: #f3f3f3; }
  .vehicle .icon { font-size: 20px; }
  .vehicle .name { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .vehicle .seats { font-size: 11px; color: var(--muted); }

  .price-box {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: #f3f3f3;
    display: none;
    align-items: center;
    justify-content: space-between;
  }
  .price-box.visible { display: flex; }
  .price-box .label { font-size: 13px; color: var(--muted); }
  .price-box .amount { font-size: 20px; font-weight: 800; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="emoji">🚕</span>
      <h1>Taxi J7</h1>
    </div>

    <h2>Réservez votre taxi</h2>
    <p class="subtitle">Votre demande est envoyée directement au répartiteur. Un chauffeur vous sera assigné sous peu.</p>

    <form id="booking-form">
      <label for="pickup">Adresse de prise en charge</label>
      <div class="ac-wrap">
        <input id="pickup" name="pickupAddress" type="text" required autocomplete="off" placeholder="Tapez l'adresse..." />
        <div class="ac-list" id="pickup-list"></div>
      </div>
      <button type="button" class="locate" id="locate-btn">📍 Utiliser ma position</button>

      <label for="destination">Destination</label>
      <div class="ac-wrap">
        <input id="destination" name="destinationAddress" type="text" required autocomplete="off" placeholder="Tapez l'adresse..." />
        <div class="ac-list" id="destination-list"></div>
      </div>

      <label>Type de véhicule</label>
      <div class="vehicles" id="vehicles">
        <div class="vehicle selected" data-vehicle="STANDARD">
          <div class="icon">🚗</div>
          <div class="name">Standard</div>
          <div class="seats">1-4 places</div>
        </div>
        <div class="vehicle" data-vehicle="VAN">
          <div class="icon">🚐</div>
          <div class="name">Van</div>
          <div class="seats">5-7 places</div>
        </div>
        <div class="vehicle" data-vehicle="PREMIUM">
          <div class="icon">⭐</div>
          <div class="name">Premium</div>
          <div class="seats">1-4 places</div>
        </div>
      </div>

      <div class="price-box" id="price-box">
        <span class="label">Prix estimé</span>
        <span class="amount" id="price-amount">—</span>
      </div>

      <label for="phone">Numéro de téléphone</label>
      <input id="phone" name="clientPhone" type="tel" required autocomplete="tel" placeholder="Ex: 0612345678" />

      <label for="name">Votre nom (optionnel)</label>
      <input id="name" name="clientName" type="text" autocomplete="name" />

      <label for="notes">Notes (optionnel)</label>
      <textarea id="notes" name="notes" rows="2" placeholder="Ex: bagages, code d'entrée..."></textarea>

      <button type="submit" id="submit-btn">Demander un taxi</button>
    </form>

    <div class="msg" id="msg"></div>

    <footer>Besoin d'aide ? Appelez-nous directement.</footer>
  </div>

<script>
  const form = document.getElementById("booking-form");
  const submitBtn = document.getElementById("submit-btn");
  const msg = document.getElementById("msg");
  const locateBtn = document.getElementById("locate-btn");
  const pickupInput = document.getElementById("pickup");
  const priceBox = document.getElementById("price-box");
  const priceAmount = document.getElementById("price-amount");

  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = "msg " + kind;
  }

  // --- Type de véhicule + prix estimé ---
  const VEHICLE_MULTIPLIER = { STANDARD: 1, VAN: 1.35, PREMIUM: 1.7 };
  const BASE_FARE = 5;
  const PER_KM = 1.8;
  let selectedVehicle = "STANDARD";
  let pickupCoords = null;
  let destinationCoords = null;

  document.getElementById("vehicles").addEventListener("click", (e) => {
    const card = e.target.closest(".vehicle");
    if (!card) return;
    document.querySelectorAll(".vehicle").forEach((el) => el.classList.remove("selected"));
    card.classList.add("selected");
    selectedVehicle = card.dataset.vehicle;
    updatePriceEstimate();
  });

  function haversineKm(a, b) {
    const R = 6371;
    const dLat = ((b.lat - a.lat) * Math.PI) / 180;
    const dLon = ((b.lon - a.lon) * Math.PI) / 180;
    const lat1 = (a.lat * Math.PI) / 180;
    const lat2 = (b.lat * Math.PI) / 180;
    const h =
      Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function updatePriceEstimate() {
    if (!pickupCoords || !destinationCoords) {
      priceBox.classList.remove("visible");
      return;
    }
    const km = haversineKm(pickupCoords, destinationCoords);
    const price = BASE_FARE + km * PER_KM * VEHICLE_MULTIPLIER[selectedVehicle];
    priceAmount.textContent = "~" + price.toFixed(0) + " $";
    priceBox.classList.add("visible");
  }

  // --- Autocomplétion d'adresses (Photon / OpenStreetMap, gratuit) ---
  function formatAddress(p) {
    const parts = [];
    const line1 = [p.housenumber, p.street || p.name].filter(Boolean).join(" ");
    if (line1) parts.push(line1);
    else if (p.name) parts.push(p.name);
    if (p.city) parts.push(p.city);
    if (p.postcode) parts.push(p.postcode);
    return parts.join(", ");
  }

  function setupAutocomplete(inputId, listId, onPick) {
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    let timer = null;
    let justPicked = false;

    async function fetchSuggestions(q) {
      const url = "https://photon.komoot.io/api/?q=" + encodeURIComponent(q) +
                  "&limit=6&lang=fr&lat=45.53&lon=-73.51";
      try {
        const res = await fetch(url);
        const data = await res.json();
        const seen = new Set();
        const out = [];
        for (const f of data.features || []) {
          const label = formatAddress(f.properties || {});
          const coords = f.geometry && f.geometry.coordinates;
          if (!label || seen.has(label) || !coords) continue;
          seen.add(label);
          out.push({ label, lon: coords[0], lat: coords[1] });
        }
        return out;
      } catch { return []; }
    }

    function render(items) {
      list.innerHTML = "";
      if (!items.length) { list.classList.remove("open"); return; }
      for (const item of items) {
        const div = document.createElement("div");
        div.className = "ac-item";
        div.textContent = "📍 " + item.label;
        div.addEventListener("mousedown", (e) => {
          e.preventDefault();
          justPicked = true;
          input.value = item.label;
          onPick({ lat: item.lat, lon: item.lon });
          list.classList.remove("open");
        });
        list.appendChild(div);
      }
      list.classList.add("open");
    }

    input.addEventListener("input", () => {
      if (justPicked) { justPicked = false; return; }
      onPick(null);
      const q = input.value.trim();
      if (timer) clearTimeout(timer);
      if (q.length < 3) { list.classList.remove("open"); return; }
      timer = setTimeout(async () => {
        render(await fetchSuggestions(q));
      }, 350);
    });
    input.addEventListener("blur", () => setTimeout(() => list.classList.remove("open"), 150));
  }

  setupAutocomplete("pickup", "pickup-list", (coords) => {
    pickupCoords = coords;
    updatePriceEstimate();
  });
  setupAutocomplete("destination", "destination-list", (coords) => {
    destinationCoords = coords;
    updatePriceEstimate();
  });

  locateBtn.addEventListener("click", () => {
    if (!navigator.geolocation) {
      showMsg("La géolocalisation n'est pas disponible sur cet appareil.", "error");
      return;
    }
    locateBtn.disabled = true;
    locateBtn.textContent = "Localisation en cours...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        pickupInput.value = latitude.toFixed(5) + ", " + longitude.toFixed(5);
        pickupCoords = { lat: latitude, lon: longitude };
        updatePriceEstimate();
        locateBtn.disabled = false;
        locateBtn.textContent = "📍 Utiliser ma position";
      },
      () => {
        showMsg("Impossible d'obtenir votre position. Entrez l'adresse manuellement.", "error");
        locateBtn.disabled = false;
        locateBtn.textContent = "📍 Utiliser ma position";
      }
    );
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Envoi en cours...";

    const data = Object.fromEntries(new FormData(form).entries());
    data.vehicleType = selectedVehicle;
    if (pickupCoords && destinationCoords) {
      const km = haversineKm(pickupCoords, destinationCoords);
      data.estimatedPrice = Math.round(BASE_FARE + km * PER_KM * VEHICLE_MULTIPLIER[selectedVehicle]);
    }

    try {
      const res = await fetch("/public/book", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(body.error || "Une erreur est survenue");
      }
      showMsg("Demande envoyée ! Redirection vers le suivi de votre course...", "success");
      form.reset();
      window.location.href = "/suivi.html?id=" + encodeURIComponent(body.id);
      return;
    } catch (err) {
      showMsg(err.message || "Impossible d'envoyer la demande. Réessayez.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Demander un taxi";
    }
  });
</script>
</body>
</html>
